volumes:
  postgres_volume:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${PG_DATABASE_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    ports:
      - ${PG_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]  
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_volume:/var/lib/postgresql/data

  migrator:
    build:
      context: .
      dockerfile: build/docker/migrations/Dockerfile    
      args:
        MIGRATION_DIR: migrations
    environment:
      - PG_DSN=${PG_DSN}
    depends_on:
      postgres:
        condition: service_healthy

  grpc-server:
    build:
      context: .
      dockerfile: build/docker/grpc-server/Dockerfile
    environment:
      - TZ=Europe/Moscow
    ports:
      - ${GRPC_EXTEND_PORT}:${GRPC_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_started
   